name: CI

on:
  push:
    branches: [main]
  pull_request:

# Where the jobs run is set by repository variables, so it can change without
# a code change (README, "Where CI runs"):
# - CI_RUNS_ON: unset means GitHub's own ubuntu-latest. Set to a JSON list of
#   runner labels, such as ["self-hosted","linux"], it sends quality (and the
#   change check below) to a self-hosted runner with those labels.
# - CI_E2E_RUNS_ON: the e2e job's runner. Unset means ubuntu-24.04, but while
#   CI_RUNS_ON is set and this one is not, e2e is skipped. Set to a JSON list of
#   runner labels it runs e2e on that self-hosted runner, in the Playwright
#   image (the self-hosted steps in the e2e job, for a runner user without sudo).
#   The schema job needs Docker too and follows the same variable and rules.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test coverage
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build

  # Pull requests only: does this change need the end-to-end test? Not when
  # every file it touches is documentation (*.md, docs/, LICENSE) or a unit
  # test (tests/ outside tests/e2e/, the Jest config). Anything else, a file it
  # cannot read, or an empty list means yes. Pushes to main skip this filter
  # (e2e still follows the runner variables at the top of the file).
  # --no-renames: a rename lists both the old and the new path, so moving a
  # file out of tests/ or docs/ still counts as touching the app.
  # Its second output, schema, says whether the schema job runs: when the change
  # touches the database files (the baseline, a migration, scripts/db/), the
  # stack's compose file, this workflow or the schema job's own test; again yes
  # when the files cannot be listed.
  # It runs on every pull request, on the runner quality uses.
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      schema: ${{ steps.schema.outputs.schema }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Files changed
        id: diff
        run: |
          if ! changed=$(git diff --no-renames --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "Could not list the changed files; e2e runs"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          e2e=false
          while IFS= read -r f; do
            case "$f" in
              tests/e2e/*) e2e=true ;;
              *.md|docs/*|LICENSE|tests/*|jest.config.js|jest.setup.js) ;;
              *) e2e=true ;;
            esac
          done <<< "$changed"
          echo "e2e needed: $e2e"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

      - name: Database files changed
        id: schema
        run: |
          if ! changed=$(git diff --no-renames --name-only HEAD^1 HEAD) || [ -z "$changed" ]; then
            echo "Could not list the changed files; schema runs"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          schema=false
          while IFS= read -r f; do
            case "$f" in
              supabase/migrations/*|SUPABASE-SETUP.sql|scripts/db/*|docker-compose.yml) schema=true ;;
              .github/workflows/ci.yml|tests/scripts/ciSchemaJob.test.js) schema=true ;;
            esac
          done <<< "$changed"
          echo "schema needed: $schema"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

  # The whole Docker stack with a fresh database and the stub field reader:
  # setup, sign in, upload, fields read, send, sign, reuse refused, signed PDF
  # checked (tests/e2e/mainFlow.e2e.js). Needs no keys and no repository settings.
  # Ubuntu 24.04: the Playwright in package-lock.json has no browser build for
  # the newer image ubuntu-latest points at.
  # Runs on pushes to main, and on pull requests the changes job says need it;
  # skipped while CI_RUNS_ON is set and CI_E2E_RUNS_ON is not (top of file).
  # Two paths, chosen by the runner, not by a variable:
  # - GitHub's runners: Chromium installed with its system packages (sudo),
  #   the gateway on port 3000 of the runner, the test run there with node.
  # - A self-hosted runner (assumed to have no sudo, rootless Docker, and an OS
  #   Playwright may have no browser build for): the test runs in the official
  #   Playwright image for the lock file's version (tests/e2e/runner.Dockerfile),
  #   inside the gateway's network namespace, so it opens the same
  #   http://localhost:3000 and the stack publishes no port there
  #   (tests/e2e/compose.selfhosted.yml).
  #   The runner's Docker socket is mounted so the test can still read the setup
  #   code and expire a link through docker compose. Its memory is measured.
  # Then a second phase on the same database (2026-11-21): the stack is brought
  # up again with COSIGN_SITE_URL set to an address that is not localhost, the
  # way the README says to (docker compose up -d, which recreates the auth
  # service and the app with it), and tests/e2e/siteAddress.e2e.js runs in a
  # browser whose own localhost is not the app: an invite opened at the site
  # address, a signing link there, the Admin role, a browser refusing storage.
  # - GitHub's runners: the site address is the runner's own non-loopback IPv4
  #   address, port 3000 published on that address only (COSIGN_BIND), the
  #   test run there with node. The same machine, at another address.
  # - A self-hosted runner: http://cosign.test:3000, a name the gateway gets on
  #   the stack's network (tests/e2e/compose.site.yml), still no published
  #   port, and the test in the Playwright image in a container of its own on
  #   that network: its own network namespace, not the gateway's, and no
  #   Docker socket.
  # The first phase hands the second the owner's and a member's address and
  # password in a file under RUNNER_TEMP that only the runner user can read
  # (COSIGN_E2E_HANDOFF); the second deletes it when read, and a last step
  # removes its folder whatever happened.
  # COMPOSE_PROJECT_NAME: one project per run, since a self-hosted runner keeps
  # Docker state between jobs.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (vars.CI_E2E_RUNS_ON != '' || vars.CI_RUNS_ON == '') && (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ${{ fromJSON(vars.CI_E2E_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cosign-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Samples the runner user's memory cgroup (its runners, its Docker and every
      # container) once a second until the job ends: the total, which includes
      # page cache, and the anon and kernel memory that cannot be given back.
      - name: Watch memory (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          slice="/sys/fs/cgroup/user.slice/user-$(id -u).slice"
          echo "CI memory cgroup: $slice"
          cat "$slice/memory.peak" > "$RUNNER_TEMP/e2e-mem-peak-start" || echo 0 > "$RUNNER_TEMP/e2e-mem-peak-start"
          grep -E '^(high|max|oom|oom_kill) ' "$slice/memory.events" > "$RUNNER_TEMP/e2e-mem-events-start" || true
          nohup sh -c '
            while :; do
              others=0
              for s in "$1"/ghci-runner@*.service; do
                case "$s" in *@co-sign.service) continue ;; esac
                [ -r "$s/memory.current" ] && others=$((others + $(cat "$s/memory.current")))
              done
              anon=0 file=0 kernel=0
              while read -r key value; do
                case "$key" in anon) anon=$value ;; file) file=$value ;; kernel) kernel=$value ;; esac
              done < "$1/memory.stat"
              echo "$(date +%s) $(cat "$1/memory.current") $others $anon $file $kernel" >> "$2"
              sleep 1
            done' sampler "$slice" "$RUNNER_TEMP/e2e-mem.log" > /dev/null 2>&1 < /dev/null &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browser
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The system packages come from an apt mirror that sometimes stalls (one run
      # sat here until the job's 30-minute limit). Each try gets 4 minutes; up to 3 tries.
      - name: Install Chromium
        if: runner.environment != 'self-hosted'
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then exit 0; fi
            echo "Chromium install try $attempt did not finish; trying again"
            sleep 5
          done
          exit 1

      # Tagged by the file's content, so the same image is reused run after run.
      - name: Build the test container (self-hosted)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 10
        run: |
          image="cosign-e2e-runner:$(sha256sum tests/e2e/runner.Dockerfile | cut -c1-12)"
          docker build -q -t "$image" - < tests/e2e/runner.Dockerfile
          echo "E2E_IMAGE=$image" >> "$GITHUB_ENV"

      # The handoff from the first phase to the second: a new folder that only
      # the runner user can open, one per run and attempt.
      - name: Folder for the second phase's handoff
        run: |
          state="$RUNNER_TEMP/e2e-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$state"
          mkdir -m 700 "$state"
          echo "E2E_STATE=$state" >> "$GITHUB_ENV"
          echo "COSIGN_E2E_HANDOFF=$state/handoff.json" >> "$GITHUB_ENV"

      - name: Start the stack
        if: runner.environment != 'self-hosted'
        run: docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml up -d --build

      - name: Start the stack (self-hosted, no published port)
        if: runner.environment == 'self-hosted'
        run: docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml -f tests/e2e/compose.selfhosted.yml up -d --build

      - name: End-to-end test
        if: runner.environment != 'self-hosted'
        run: node tests/e2e/mainFlow.e2e.js

      # No COSIGN_URL: the test opens its default http://localhost:3000 (the
      # gateway, in whose network namespace it runs), so it reads the setup code
      # and expires a link through docker compose itself, as on GitHub's runners.
      # Its output is the test's own, which hides the setup code and password.
      - name: End-to-end test (self-hosted, in the Playwright container)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 15
        run: |
          sock="${DOCKER_HOST:-unix:///var/run/docker.sock}"
          sock="${sock#unix://}"
          [ -S "$sock" ] || { echo "No Docker socket at $sock (DOCKER_HOST must be a local unix socket)"; exit 1; }
          gateway=$(docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ps -q gateway)
          [ -n "$gateway" ] || { echo "The gateway container is not running"; exit 1; }
          docker run --rm --init --name "$COMPOSE_PROJECT_NAME-test" \
            --network "container:$gateway" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
            -v "$sock:/var/run/docker.sock" -e DOCKER_HOST=unix:///var/run/docker.sock \
            -v "$E2E_STATE:$E2E_STATE" -e COSIGN_E2E_HANDOFF \
            -e COMPOSE_PROJECT_NAME -e CI \
            "$E2E_IMAGE" node tests/e2e/mainFlow.e2e.js

      - name: Start the stack again at the site address
        if: runner.environment != 'self-hosted'
        timeout-minutes: 10
        run: |
          # The runner's own IPv4 address on its network (not loopback), the
          # port published there only: http://localhost:3000 is not the app.
          ip=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          case "$ip" in '' | 127.*) echo "No non-loopback IPv4 address on this runner"; exit 1 ;; esac
          echo "COSIGN_BIND=$ip" >> "$GITHUB_ENV"
          echo "COSIGN_SITE_URL=http://$ip:3000" >> "$GITHUB_ENV"
          start=$(date +%s)
          COSIGN_BIND="$ip" COSIGN_SITE_URL="http://$ip:3000" docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml up -d
          echo "docker compose up -d took $(( $(date +%s) - start )) s"
          docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ps --format '{{.Service}}: {{.Status}}'

      # On a self-hosted runner: http://cosign.test:3000, the gateway's name on
      # the stack's network (compose.site.yml). Still no published port.
      - name: Start the stack again at the site address (self-hosted)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 10
        run: |
          site=http://cosign.test:3000
          echo "COSIGN_SITE_URL=$site" >> "$GITHUB_ENV"
          start=$(date +%s)
          COSIGN_SITE_URL="$site" docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml -f tests/e2e/compose.selfhosted.yml -f tests/e2e/compose.site.yml up -d
          echo "docker compose up -d took $(( $(date +%s) - start )) s"
          docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ps --format '{{.Service}}: {{.Status}}'

      - name: Second phase at the site address
        if: runner.environment != 'self-hosted'
        timeout-minutes: 15
        run: node tests/e2e/siteAddress.e2e.js

      # A container of its own on the stack's network: its own network
      # namespace (not the gateway's), so its localhost is not the app, and no
      # Docker socket. The site address and the handoff file are all it gets.
      - name: Second phase at the site address (self-hosted, a browser on its own network namespace)
        if: runner.environment == 'self-hosted'
        timeout-minutes: 15
        run: |
          net="${COMPOSE_PROJECT_NAME}_default"
          docker network inspect "$net" > /dev/null || { echo "No network $net"; exit 1; }
          docker run --rm --init --name "$COMPOSE_PROJECT_NAME-site" \
            --network "$net" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
            -v "$E2E_STATE:$E2E_STATE" -e COSIGN_E2E_HANDOFF \
            -e COSIGN_SITE_URL -e CI \
            "$E2E_IMAGE" node tests/e2e/siteAddress.e2e.js

      - name: Container states
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ps -a
          for id in $(docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml ps -aq); do
            docker inspect --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} {{if .State.Health}}{{json .State.Health.Log}}{{end}}' "$id"
          done

      # The database's first start logs the statement that sets the password
      # the keys service made (ALTER USER ... WITH PASSWORD '...'): hidden too.
      - name: Stack logs (setup code hidden)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml logs --no-color --timestamps \
            | sed -E 's/Setup code: [0-9a-f]{32}/Setup code: [hidden]/g' \
            | sed -E "s/(PASSWORD[[:space:]]+')[^']*/\1[hidden]/Ig"

      - name: Memory (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: |
          slice="/sys/fs/cgroup/user.slice/user-$(id -u).slice"
          mib() { echo $(( ${1:-0} / 1048576 )); }
          if [ -s "$RUNNER_TEMP/e2e-mem.log" ]; then
            read -r n total0 total anon0 anon anonat hard others < <(awk '
              NR == 1 { t0 = $2; a0 = $4 }
              $2 > t { t = $2 }
              $4 > a { a = $4; at = $1 }
              $4 + $6 > h { h = $4 + $6 }
              $3 > o { o = $3 }
              END { printf "%d %.0f %.0f %.0f %.0f %d %.0f %.0f\n", NR, t0, t, a0, a, at, h, o }' "$RUNNER_TEMP/e2e-mem.log")
            echo "Sampled once a second, $n samples:"
            echo "  whole CI memory cgroup (memory.current, page cache included): $(mib "$total0") MiB at the start, peak $(mib "$total") MiB"
            echo "  anon (process memory; no swap): $(mib "$anon0") MiB at the start, peak $(mib "$anon") MiB at $(date -u -d "@$anonat" +%H:%M:%S) UTC"
            echo "  anon + kernel, peak: $(mib "$hard") MiB"
            echo "  other runners' own processes (not their containers), at most: $(mib "$others") MiB"
          fi
          echo "memory.peak of the CI memory cgroup (since it was made): $(mib "$(cat "$RUNNER_TEMP/e2e-mem-peak-start" 2>/dev/null)") MiB at the start, $(mib "$(cat "$slice/memory.peak")") MiB now"
          echo "Caps: memory.high $(cat "$slice/memory.high"), memory.max $(cat "$slice/memory.max")"
          echo "memory.events at the start:"; cat "$RUNNER_TEMP/e2e-mem-events-start" 2>/dev/null || true
          echo "memory.events now:"; grep -E '^(high|max|oom|oom_kill) ' "$slice/memory.events" || true

      # The handoff file (gone once the second phase reads it, but not if that
      # phase never ran) and its folder, on both paths.
      - name: Remove the second phase's handoff folder
        if: always()
        run: |
          if [ -n "${E2E_STATE:-}" ]; then rm -rf -- "$E2E_STATE"; fi
          left=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'e2e-state-*' -print)
          if [ -n "$left" ]; then echo "::error::Left behind:"; echo "$left"; exit 1; fi
          echo "Left behind: nothing (no e2e-state-* folder in $RUNNER_TEMP)"

      # The two test containers (normally gone with --rm, but not if the job
      # was cancelled), the stack with its volumes and network, and the two
      # images it built; then nothing of the run's project may be left.
      # What stays: the pulled images, the test container's image and the build
      # cache, reused by the next run and pruned on the runner's own schedule.
      - name: Remove the test container and the stack's images (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: |
          docker rm -f "$COMPOSE_PROJECT_NAME-test" "$COMPOSE_PROJECT_NAME-site" > /dev/null 2>&1 || true
          docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml -f tests/e2e/compose.selfhosted.yml down -v --rmi local
          project="label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          left=$(docker ps -aq --filter "$project"; docker ps -aq --filter "name=^$COMPOSE_PROJECT_NAME-"; docker volume ls -q --filter "$project"; docker network ls -q --filter "$project")
          [ -z "$left" ] || { echo "Left behind by $COMPOSE_PROJECT_NAME:"; echo "$left"; exit 1; }
          echo "Nothing of $COMPOSE_PROJECT_NAME is left"

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f tests/e2e/compose.e2e.yml down -v

  # The database can be built from the repository alone. An empty database of
  # the stack's own kind (the db service, the Supabase Postgres image with the
  # anon, authenticated and service_role roles; auth and storage make their own
  # schemas), then
  # SUPABASE-SETUP.sql and every migration the way a new self-hoster gets them:
  # the stack's one-shot migrate service (scripts/db/migrate.js). Then the
  # schema check (scripts/db/schemaCheck.js: what the app uses is there, with
  # row-level security) and the access check (scripts/db/rlsCheck.js: anon and
  # a user of another organisation reach none of org A's rows; it writes inside
  # one transaction and rolls it back). Any problem or leak fails the job.
  # Only db, keys, auth, rest (storage needs it), storage and migrate start: no
  # app and no gateway, and no port is published. The checks run in the migrate
  # service's own image (built from this checkout, with pg) on the stack's
  # network through `docker compose run`, so the database address and its
  # password are the compose file's own and appear nowhere here or in the log.
  # Runs on pushes to main, and on pull requests the changes job's schema
  # output says need it. Same runner variable as e2e (both need Docker):
  # skipped while CI_RUNS_ON is set and CI_E2E_RUNS_ON is not.
  schema:
    needs: changes
    if: ${{ !cancelled() && (vars.CI_E2E_RUNS_ON != '' || vars.CI_RUNS_ON == '') && (github.event_name != 'pull_request' || needs.changes.outputs.schema == 'true') }}
    runs-on: ${{ fromJSON(vars.CI_E2E_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: cosign-schema-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner user's memory cgroup (its runners, its Docker, every container),
      # sampled once a second: the total (page cache included) and anon.
      - name: Watch memory (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          slice="/sys/fs/cgroup/user.slice/user-$(id -u).slice"
          grep -E '^(high|max|oom|oom_kill) ' "$slice/memory.events" > "$RUNNER_TEMP/schema-mem-events-start" || true
          nohup sh -c '
            while :; do
              anon=0
              while read -r key value; do [ "$key" = anon ] && anon=$value; done < "$1/memory.stat"
              echo "$(cat "$1/memory.current") $anon" >> "$2"
              sleep 1
            done' sampler "$slice" "$RUNNER_TEMP/schema-mem.log" > /dev/null 2>&1 < /dev/null &

      # docker compose up starts what these four need (keys, rest) and waits for
      # db, auth and storage to be healthy before migrate starts. migrate's own
      # lines name each file it applied; a fresh database gets all of them.
      - name: Empty database, then the baseline and every migration
        id: migrate
        timeout-minutes: 15
        run: |
          docker compose up -d --build db auth storage migrate
          migrate=$(docker compose ps -aq migrate)
          [ -n "$migrate" ] || { echo "No migrate container"; exit 1; }
          code=$(docker wait "$migrate")
          docker compose logs --no-color migrate
          echo "migrate exited with $code"
          [ "$code" = 0 ] || exit 1
          files=$(( $(ls supabase/migrations/*.sql | wc -l) + 1 ))
          docker compose logs --no-color migrate | grep -q "done: $files applied" \
            || { echo "migrate did not apply all $files files (SUPABASE-SETUP.sql and every migration)"; exit 1; }

      - name: Schema check
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        timeout-minutes: 5
        run: docker compose run --rm --no-deps -T migrate node scripts/db/schemaCheck.js

      # Runs after a failed schema check too, so one run reports both.
      - name: Row-level security check
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        timeout-minutes: 5
        run: docker compose run --rm --no-deps -T migrate node scripts/db/rlsCheck.js

      - name: Container states
        if: failure()
        run: |
          docker compose ps -a
          for id in $(docker compose ps -aq); do
            docker inspect --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} {{if .State.Health}}{{json .State.Health.Log}}{{end}}' "$id"
          done

      - name: Memory (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: |
          slice="/sys/fs/cgroup/user.slice/user-$(id -u).slice"
          mib() { echo $(( ${1:-0} / 1048576 )); }
          if [ -s "$RUNNER_TEMP/schema-mem.log" ]; then
            read -r n total0 total anon0 anon < <(awk '
              NR == 1 { t0 = $1; a0 = $2 }
              $1 > t { t = $1 }
              $2 > a { a = $2 }
              END { printf "%d %.0f %.0f %.0f %.0f\n", NR, t0, t, a0, a }' "$RUNNER_TEMP/schema-mem.log")
            echo "Sampled once a second, $n samples:"
            echo "  whole CI memory cgroup (page cache included): $(mib "$total0") MiB at the start, peak $(mib "$total") MiB"
            echo "  anon (process memory; no swap): $(mib "$anon0") MiB at the start, peak $(mib "$anon") MiB"
          fi
          echo "Caps: memory.high $(cat "$slice/memory.high"), memory.max $(cat "$slice/memory.max")"
          echo "memory.events at the start:"; cat "$RUNNER_TEMP/schema-mem-events-start" 2>/dev/null || true
          echo "memory.events now:"; grep -E '^(high|max|oom|oom_kill) ' "$slice/memory.events" || true

      # The stack with its volumes, the check containers (gone with --rm unless
      # the job was cancelled) and the migrate image it built. What stays: the
      # pulled images and the build cache, pruned on the runner's own schedule.
      - name: Take everything down with its volumes
        if: always()
        run: |
          docker compose down -v --remove-orphans --rmi local
          project="label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          left=$(docker ps -aq --filter "$project"; docker volume ls -q --filter "$project"; docker network ls -q --filter "$project")
          [ -z "$left" ] || { echo "Left behind by $COMPOSE_PROJECT_NAME:"; echo "$left"; exit 1; }
          echo "Nothing of $COMPOSE_PROJECT_NAME is left"
